[project]
name = "slide-decks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "jinja2>=3.1.6",
    "openai-agents>=0.25.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.3",
]

[dependency-groups]
dev = [
    "pre-commit>=4.0.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-mock>=3.17.0",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.ruff]
extend-exclude = ["docs/reference"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "RUF", "TID"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.flake8-tidy-imports]
# Allow local `from .base` imports, but never parent-relative (`from ..` / `from ...`).
ban-relative-imports = "parents"

[tool.ruff.lint.per-file-ignores]
# Embedded HTML/CSS/JS template literals; splitting them would alter the output.
"decks/render/gallery.py" = ["E501"]
"tests/test_examples.py" = ["E501"]

[tool.ty.src]
include = ["decks", "scripts"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
